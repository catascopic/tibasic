<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Minimal PyScript</title>
	<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

<p id="message">Hello from HTML.</p>
<button id="btn">Click me</button>

<script type="py">
from pyscript import document
from pyodide.ffi import create_proxy

def on_click(event):
	document.getElementById("message").innerText = "Updated by Python!"

document.getElementById("btn").addEventListener("click", create_proxy(on_click))
</script>

</body>
</html>
